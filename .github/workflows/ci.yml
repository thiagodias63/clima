name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ou a versão do Node que você utiliza no projeto
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run unit tests (Vitest)
        run: npm run test:vitest:coverage

      - name: Run mutation tests (Stryker)
        run: npm run stryker

      - name: Generate badges
        run: npm run badges

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          jq -n \
            --arg coverage "$(cat badges/coverage.json)" \
            --arg mutation "$(cat badges/mutation.json)" \
            '{
              files: {
                "coverage.json": {
                  content: $coverage
                },
                "mutation.json": {
                  content: $mutation
                }
              }
            }' > gist-payload.json
      
          gh api \
            --method PATCH \
            "/gists/$GIST_ID" \
            --input gist-payload.json
