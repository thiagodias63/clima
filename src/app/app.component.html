<div class="flex flex-col gap-4 p-4">
  <div class="flex items-center gap-4 flex-wrap">
    <button nbButton [disabled]="isLoadingLocation()" (click)="detectLocation()">
      @if (isLoadingLocation()) {
        Detectando...
      } @else {
        Detectar Minha Localização 📍
      }
    </button>

    @if (locationError()) {
      <span class="text-red-600 font-bold border-2 border-black p-2 bg-red-100">
        ⚠️ {{ locationError() }}
      </span>
    }
  </div>

  @if (localCity()) {
    <div class="flex flex-col gap-2">
      <h3 class="font-bold text-lg uppercase font-black">Sua Localização:</h3>
      <app-city [city]="localCity()!.city" [temperature]="localCity()!.temperature"></app-city>
    </div>
  }

  <h3 class="font-bold text-lg uppercase font-black mt-4">Previsões por Cidade:</h3>
  <div class="grid grid-flow-row gap-4 md:grid-flow-col">
    @for (c of citiesResource.value(); track c.city) {
      <app-city [city]="c.city" [temperature]="c.temperature"></app-city>
    }
  </div>
</div>
<router-outlet />
