<div class="w-80">
  <nb-card>
    <nb-card-content>
      <div class="overflow-hidden border-[3px] border-black shadow-[4px_4px_0_0_#000]">
        <iframe
          class="h-48 w-full"
          title="Mapa da localizacao atual"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          [src]="mapUrl()"
          data-testid="city-map"
        ></iframe>
      </div>
    </nb-card-content>
  </nb-card>
</div>
