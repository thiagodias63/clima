<div class="w-80">
  <nb-card>
    <nb-card-header>
      @if (latitude() && longitude()) {
      <app-city-map [latitude]="latitude()!" [longitude]="longitude()!" />
      }
      <nb-card-title>
        <h4 nbTitle class="text-lg font-black uppercase" data-testid="city">
          {{ city() }}
        </h4>
      </nb-card-title>
    </nb-card-header>

    <nb-card-content>
      <h2 nbTitle class="font-mono text-4xl font-black leading-tight uppercase" data-testid="temperature">
        {{ temperatureWithEmoji() }}
      </h2>
    </nb-card-content>
  </nb-card>
</div>
