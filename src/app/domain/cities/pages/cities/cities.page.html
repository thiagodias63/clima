<div nbStack gap="md" class="p-4">
  <h3 nbTitle class="text-lg uppercase mt-4">Previsões por Cidade:</h3>
  <div nbCluster gap="md">
    @for (c of citiesResource.value(); track c.city) {
    <city-card [city]="c.city" [temperature]="c.temperature" [latitude]="c.latitude" [longitude]="c.longitude" />
    }
  </div>
</div>
