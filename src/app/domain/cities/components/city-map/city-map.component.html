<div class="overflow-hidden border-[3px] border-black shadow-[4px_4px_0_0_#000] mb-6">
	@if (showRealMap()) {
		<iframe
			class="h-48 w-full"
			title="Mapa da localizacao atual"
			loading="lazy"
			referrerpolicy="no-referrer-when-downgrade"
			[src]="mapIframeUrl()"
			data-testid="city-map"></iframe>
	} @else {
		<canvas
			[id]="city()"
			class="h-48 w-full"></canvas>
	}
</div>
